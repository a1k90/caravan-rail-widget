  <circle cx="20.5" cy="29" r="1.5" fill="#CBD5E1" />

  <rect x="41" y="28" width="5" height="10" rx="2.5" fill="#334155" stroke="#6C7A89" stroke-width="1.5" />
  <circle cx="43.5" cy="29" r="1.5" fill="#CBD5E1" />

