<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="33" y1="26" x2="55" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="12" y1="10" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Документ декларации -->
  <path d="M12 10 H36 L46 20 V52 H12 Z" fill="url(#docGrad)" stroke="#CBD5E1" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Уголок -->
  <path d="M36 10 V20 H46 Z" fill="#334155" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round" />

  <!-- Строки данных -->
  <line x1="18" y1="18" x2="28" y2="18" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="18" y1="25" x2="32" y2="25" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="31" x2="28" y2="31" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="37" x2="24" y2="37" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- Таможенная печать -->
  <circle cx="23" cy="44" r="5.5" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M21 44 L22.5 45.5 L25.5 42.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Щит таможенного контроля с галочкой -->
  <path d="M44 26 L55 30 V42 C55 49, 44 55, 44 55 C44 55, 33 49, 33 42 V30 Z" fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
  <!-- Галочка (успешный выпуск) -->
  <path d="M39 42 L42.5 45.5 L49 38" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
