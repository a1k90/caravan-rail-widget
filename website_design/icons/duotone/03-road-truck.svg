<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="trailerGrad" x1="6" y1="16" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cabGrad" x1="40" y1="17" x2="58" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Дорога -->
  <line x1="4" y1="56" x2="60" y2="56" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Динамика / ветер -->
  <line x1="1" y1="24" x2="4" y2="24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <line x1="2" y1="30" x2="4" y2="30" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <line x1="1" y1="36" x2="4" y2="36" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

  <!-- Кузов полуприцепа -->
  <rect x="6" y="16" width="34" height="26" rx="2" fill="url(#trailerGrad)" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="10" y1="16" x2="10" y2="42" stroke="#475569" stroke-width="2" />
  <!-- Акцентная полоса Caravan на кузове -->
  <path d="M12 28 H38" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <!-- Нижний ящик / отбойник -->
  <rect x="18" y="42" width="14" height="4" rx="1" fill="#334155" stroke="#64748B" stroke-width="1.5" />

  <!-- Кабина тягача Caravan Gold -->
  <path d="M40 21 C 42 17, 47 17, 51 21 L 56 31 L 58 41 H 42 V 21 Z" fill="url(#cabGrad)" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round" />
  <!-- Лобовое стекло кабины -->
  <path d="M44 23 L 52 24 L 51 31 L 43 31 Z" fill="#38BDF8" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round" />
  <!-- Фара -->
  <rect x="54" y="38" width="4" height="3.5" rx="1" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.2" />
  <line x1="48" y1="41" x2="52" y2="41" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" />

  <!-- Колеса -->
  <!-- Колесо 1 -->
  <circle cx="14" cy="48" r="5.5" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
  <circle cx="14" cy="48" r="2.5" fill="#F59E0B" />
  <!-- Колесо 2 -->
  <circle cx="25" cy="48" r="5.5" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
  <circle cx="25" cy="48" r="2.5" fill="#F59E0B" />
  <!-- Колесо 3 -->
  <circle cx="43" cy="48" r="5.5" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
  <circle cx="43" cy="48" r="2.5" fill="#CBD5E1" />
  <!-- Колесо 4 -->
  <circle cx="53" cy="48" r="5.5" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
  <circle cx="53" cy="48" r="2.5" fill="#CBD5E1" />
</svg>
