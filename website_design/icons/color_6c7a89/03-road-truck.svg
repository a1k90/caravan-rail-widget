<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#6C7A89" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Полуприцеп (еврофура) -->
  <rect x="6" y="16" width="34" height="26" rx="2" />
  <line x1="10" y1="16" x2="10" y2="42" />
  <!-- Рефрижератор / аэро-обтекатель спереди -->
  <path d="M38 18 H40 V24 H38" />
  <!-- Защитный брус / паллетный ящик снизу -->
  <rect x="18" y="42" width="14" height="4" rx="1" />

  <!-- Тягач -->
  <!-- Спойлер крыши и лобовое стекло -->
  <path d="M40 21 C 42 17, 47 17, 51 21 L 56 31" />
  <path d="M44 23 L 52 24 L 51 31 L 43 31 Z" />
  <!-- Передняя маска, решетка и капот -->
  <path d="M56 31 L 58 41 H 42" />
  <!-- Фара и бампер -->
  <rect x="54" y="39" width="4" height="4" rx="1" fill="#6C7A89" />
  <line x1="48" y1="41" x2="52" y2="41" />

  <!-- Колеса (4 видимых колеса) -->
  <!-- Полуприцеп -->
  <circle cx="14" cy="48" r="5" />
  <circle cx="14" cy="48" r="2" fill="#6C7A89" />
  <circle cx="25" cy="48" r="5" />
  <circle cx="25" cy="48" r="2" fill="#6C7A89" />
  <!-- Тягач -->
  <circle cx="43" cy="48" r="5" />
  <circle cx="43" cy="48" r="2" fill="#6C7A89" />
  <circle cx="53" cy="48" r="5" />
  <circle cx="53" cy="48" r="2" fill="#6C7A89" />

  <!-- Дорога и линии скорости -->
  <line x1="4" y1="56" x2="60" y2="56" />
  <line x1="1" y1="24" x2="4" y2="24" />
  <line x1="2" y1="30" x2="4" y2="30" />
  <line x1="1" y1="36" x2="4" y2="36" />
</svg>
