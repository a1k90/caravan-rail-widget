<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#6C7A89" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Глобус / Земной шар -->
  <circle cx="32" cy="32" r="16" />
  <!-- Меридиан -->
  <path d="M32 16 C25 22, 25 42, 32 48 C39 42, 39 22, 32 16" />
  <!-- Параллели -->
  <line x1="16" y1="32" x2="48" y2="32" />
  <path d="M19 24 Q32 28 45 24" stroke-width="2" />
  <path d="M19 40 Q32 36 45 40" stroke-width="2" />

  <!-- Логистический маршрут экспедирования (Точки A -> B -> C) -->
  <circle cx="23" cy="27" r="2.5" fill="#6C7A89" />
  <circle cx="34" cy="25" r="2.5" fill="#6C7A89" />
  <!-- Маршрутная кривая -->
  <path d="M23 27 Q 28 22 34 25 Q 39 28 44 32" stroke-width="2" stroke-dasharray="2 3" />

  <!-- Гео-метка пункта назначения (GPS Pin) -->
  <path d="M44 24 C41.5 24, 39.5 26, 39.5 28.5 C39.5 32, 44 37, 44 37 C44 37, 48.5 32, 48.5 28.5 C48.5 26, 46.5 24, 44 24 Z" fill="#6C7A89" />
  <circle cx="44" cy="28.5" r="1.5" fill="#000000" />

  <!-- Динамические орбитальные стрелки экспедирования (360° контроль) -->
  <!-- Верхняя стрелка -->
  <path d="M10 34 C10 18, 24 8, 38 8 C44 8, 49 10, 53 14" />
  <path d="M48 13 L54 15 L52 9" />

  <!-- Нижняя стрелка -->
  <path d="M54 30 C54 46, 40 56, 26 56 C20 56, 15 54, 11 50" />
  <path d="M16 51 L10 49 L12 55" />
</svg>
