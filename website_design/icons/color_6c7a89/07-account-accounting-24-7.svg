<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#6C7A89" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Терминал портала (Окно личного кабинета) -->
  <rect x="7" y="8" width="50" height="48" rx="5" />
  
  <!-- Верхняя панель: Личный кабинет + Бейдж 24/7 -->
  <!-- Аватар пользователя (Личный кабинет) -->
  <circle cx="19" cy="20" r="4.5" />
  <path d="M 12 31 C 12 27, 15 26, 19 26 C 23 26, 26 27, 26 31" />
  <line x1="29" y1="21" x2="37" y2="21" stroke-width="2" />
  <line x1="29" y1="26" x2="34" y2="26" stroke-width="1.8" />

  <!-- Бейдж круглосуточного сервиса 24/7 -->
  <circle cx="47" cy="21" r="8" />
  <path d="M 47 16 A 5 5 0 1 1 42 21" stroke-width="1.5" />
  <text x="47" y="23.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="6.5" stroke="none" fill="#6C7A89" text-anchor="middle">24/7</text>

  <!-- Горизонтальный разделитель зон -->
  <line x1="7" y1="35" x2="57" y2="35" />

  <!-- Нижняя панель: Онлайн-бухгалтерия (Счет-фактура и финансовый график) -->
  <!-- Иконка документа / акта сверки -->
  <rect x="13" y="40" width="10" height="11" rx="1.5" />
  <line x1="16" y1="43" x2="20" y2="43" stroke-width="1.5" />
  <line x1="16" y1="47" x2="19" y2="47" stroke-width="1.5" />

  <!-- Столбцы финансового баланса (Бухгалтерия) -->
  <rect x="29" y="45" width="4" height="6" rx="1" />
  <rect x="36" y="41" width="4" height="10" rx="1" />
  <rect x="43" y="38" width="4" height="13" rx="1" />
  <path d="M 27 45 L 34 40 L 41 38 L 49 35" stroke-width="1.8" />
</svg>
