<!-- ====================================================================
     CARAVAN RAILROAD — ИНТЕРАКТИВНЫЙ БЛОК ПЛИТОК 6 УСЛУГ ДЛЯ TILDA (T123)
     С поддержкой языков (RU / EN / ZH) и модальными карточками описания
     ==================================================================== -->

<div id="cr-services-app" class="cr-services-root">
  
  <!-- Языковой переключатель в блоке -->
  <div class="cr-services-lang-bar">
    <div class="cr-lang-toggle">
      <button type="button" class="cr-lang-btn active" data-lang="ru">RU</button>
      <button type="button" class="cr-lang-btn" data-lang="en">EN</button>
      <button type="button" class="cr-lang-btn" data-lang="zh">中文</button>
    </div>
  </div>

  <!-- Сетка 6 плиток -->
  <div class="cr-tiles-grid" id="cr-tiles-container">
    <!-- Плитки генерируются скриптом -->
  </div>

  <!-- Модальное окно (Попап) -->
  <div class="cr-modal-backdrop" id="cr-service-modal" style="display: none;">
    <div class="cr-modal-dialog">
      <button type="button" class="cr-modal-close" id="cr-close-modal-btn">✕</button>
      <div class="cr-modal-body" id="cr-modal-content">
        <!-- Содержимое карточки -->
      </div>
    </div>
  </div>

</div>

<style>
  /* Шрифты и переменные */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&family=Unbounded:wght@600;700;800&display=swap');

  .cr-services-root {
    --cr-bg-card: rgba(15, 26, 48, 0.85);
    --cr-bg-hover: rgba(24, 40, 72, 0.95);
    --cr-border: rgba(108, 122, 137, 0.25);
    --cr-border-hover: rgba(245, 158, 11, 0.5);
    --cr-gold: #F59E0B;
    --cr-slate: #6C7A89;
    --cr-text: #F8FAFC;
    --cr-muted: #94A3B8;
    
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--cr-text);
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 15px;
    box-sizing: border-box;
  }

  .cr-services-root * {
    box-sizing: border-box;
  }

  /* Панель языков */
  .cr-services-lang-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 24px;
  }

  .cr-lang-toggle {
    display: inline-flex;
    background: rgba(11, 19, 37, 0.9);
    border: 1px solid var(--cr-border);
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
  }

  .cr-lang-btn {
    background: transparent;
    border: none;
    color: var(--cr-muted);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .cr-lang-btn:hover {
    color: #FFFFFF;
  }

  .cr-lang-btn.active {
    background: var(--cr-slate);
    color: #FFFFFF;
    box-shadow: 0 0 10px rgba(108, 122, 137, 0.4);
  }

  /* Сетка 3x2 плиток */
  .cr-tiles-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }

  @media (max-width: 960px) {
    .cr-tiles-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 620px) {
    .cr-tiles-grid {
      grid-template-columns: 1fr;
    }
  }

  /* Плитка услуги */
  .cr-tile-card {
    background: linear-gradient(160deg, rgba(21, 34, 56, 0.8) 0%, rgba(11, 19, 37, 0.92) 100%);
    border: 1px solid var(--cr-border);
    border-radius: 16px;
    padding: 30px 24px 24px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .cr-tile-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--cr-gold), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .cr-tile-card:hover {
    transform: translateY(-5px);
    border-color: var(--cr-border-hover);
    background: linear-gradient(160deg, rgba(26, 43, 72, 0.9) 0%, rgba(15, 26, 48, 0.98) 100%);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), 0 0 20px rgba(245, 158, 11, 0.15);
  }

  .cr-tile-card:hover::before {
    opacity: 1;
  }

  .cr-tile-top {
    margin-bottom: 20px;
  }

  .cr-tile-icon-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .cr-tile-icon {
    width: 56px;
    height: 56px;
    background: rgba(108, 122, 137, 0.12);
    border: 1px solid rgba(108, 122, 137, 0.3);
    border-radius: 14px;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }

  .cr-tile-card:hover .cr-tile-icon {
    background: rgba(245, 158, 11, 0.15);
    border-color: rgba(245, 158, 11, 0.4);
    transform: scale(1.05);
  }

  .cr-tile-icon svg {
    width: 100%;
    height: 100%;
  }

  .cr-tile-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--cr-slate);
    opacity: 0.7;
  }

  .cr-tile-title {
    font-family: 'Outfit', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.35;
    margin-bottom: 12px;
    transition: color 0.2s ease;
  }

  .cr-tile-card:hover .cr-tile-title {
    color: var(--cr-gold);
  }

  .cr-tile-desc {
    font-size: 14px;
    color: #CBD5E1;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .cr-tile-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .cr-tile-more-lbl {
    font-size: 13px;
    font-weight: 600;
    color: var(--cr-gold);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: gap 0.2s ease;
  }

  .cr-tile-card:hover .cr-tile-more-lbl {
    gap: 10px;
  }

  .cr-tile-arrow {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 13px;
    transition: all 0.2s ease;
  }

  .cr-tile-card:hover .cr-tile-arrow {
    background: var(--cr-gold);
    color: #070B14;
    transform: translateX(3px);
  }

  /* Попап */
  .cr-modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(7, 11, 20, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 999999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  .cr-modal-dialog {
    position: relative;
    max-width: 860px;
    width: 100%;
    margin: auto;
    background: #080D1A;
    border: 1px solid rgba(108, 122, 137, 0.35);
    border-radius: 20px;
    padding: 34px 36px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 30px rgba(245, 158, 11, 0.1);
    color: #F8FAFC;
    animation: crPopIn 0.25s ease;
  }

  @keyframes crPopIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .cr-modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #1E293B;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #FFFFFF;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 10;
  }

  .cr-modal-close:hover {
    background: #EF4444;
    border-color: #EF4444;
    transform: rotate(90deg);
  }

  /* Детали внутри модалки */
  .cr-modal-hero {
    display: flex;
    gap: 22px;
    align-items: flex-start;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .cr-modal-hero-icon {
    width: 72px;
    height: 72px;
    background: rgba(108, 122, 137, 0.15);
    border: 1px solid rgba(108, 122, 137, 0.35);
    border-radius: 18px;
    padding: 10px;
    flex-shrink: 0;
  }

  .cr-modal-hero-icon svg {
    width: 100%;
    height: 100%;
  }

  .cr-modal-hero-text h3 {
    font-family: 'Unbounded', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #FFFFFF;
    margin-bottom: 8px;
  }

  .cr-modal-hero-text .cr-badge-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 9999px;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.35);
    color: var(--cr-gold);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .cr-modal-hero-text p {
    font-size: 14px;
    color: #CBD5E1;
    line-height: 1.6;
  }

  /* Сетка 4 преимуществ */
  .cr-modal-adv-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }

  @media (max-width: 600px) {
    .cr-modal-adv-grid {
      grid-template-columns: 1fr;
    }
  }

  .cr-adv-item {
    background: rgba(15, 26, 48, 0.6);
    border: 1px solid rgba(108, 122, 137, 0.2);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
  }

  .cr-adv-icon {
    font-size: 18px;
  }

  .cr-adv-text h4 {
    font-size: 13px;
    font-weight: 700;
    color: #FFFFFF;
    margin-bottom: 4px;
  }

  .cr-adv-text p {
    font-size: 12px;
    color: var(--cr-muted);
    line-height: 1.45;
  }

  /* Спецификации */
  .cr-specs-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .cr-spec-box {
    background: rgba(10, 18, 33, 0.7);
    border: 1px solid rgba(108, 122, 137, 0.2);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }

  .cr-spec-val {
    color: var(--cr-gold);
    font-weight: 700;
  }

  /* Подвал модалки */
  .cr-modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    flex-wrap: wrap;
    gap: 14px;
  }

  .cr-modal-contacts {
    font-size: 12px;
    color: var(--cr-muted);
    display: flex;
    gap: 16px;
  }

  .cr-modal-contacts strong {
    color: #FFFFFF;
  }

  .cr-cta-btn {
    background: var(--cr-gold);
    color: #070B14;
    font-size: 13px;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
  }

  .cr-cta-btn:hover {
    background: #FBBF24;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    transform: translateY(-1px);
  }
</style>

<!-- Скрипт инициализации и данных -->
<script src="https://cdn.jsdelivr.net/gh/a1k90/caravan-rail-widget@main/caravan_services_data.js"></script>
<script>
  (function() {
    let activeLang = 'ru';
    let data = window.CARAVAN_SERVICES_DEFAULT_DATA;

    function init() {
      renderTiles();
      bindEvents();
    }

    function renderTiles() {
      const container = document.getElementById('cr-tiles-container');
      if (!container || !data) return;
      container.innerHTML = '';

      const keys = Object.keys(data);
      const moreText = activeLang === 'zh' ? '查看详情' : (activeLang === 'en' ? 'Learn more' : 'Подробнее');

      keys.forEach(k => {
        const item = data[k];
        const title = item.title[activeLang] || item.title.ru;
        const desc = item.description[activeLang] || item.description.ru;
        const iconSvg = window.CARAVAN_ICONS ? window.CARAVAN_ICONS[item.iconKey] : '';

        const card = document.createElement('div');
        card.className = 'cr-tile-card';
        card.setAttribute('data-id', k);
        card.innerHTML = `
          <div class="cr-tile-top">
            <div class="cr-tile-icon-row">
              <div class="cr-tile-icon">${iconSvg}</div>
              <span class="cr-tile-num">${item.number}</span>
            </div>
            <h3 class="cr-tile-title">${title}</h3>
            <p class="cr-tile-desc">${desc}</p>
          </div>
          <div class="cr-tile-bottom">
            <span class="cr-tile-more-lbl">${moreText}</span>
            <div class="cr-tile-arrow">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </div>
          </div>
        `;
        card.addEventListener('click', () => openModal(k));
        container.appendChild(card);
      });
    }

    function openModal(key) {
      const modal = document.getElementById('cr-service-modal');
      const content = document.getElementById('cr-modal-content');
      const item = data[key];
      if (!modal || !content || !item) return;

      const title = item.title[activeLang] || item.title.ru;
      const badge = item.badge[activeLang] || item.badge.ru;
      const desc = item.description[activeLang] || item.description.ru;
      const details = item.details[activeLang] || item.details.ru;
      const cta = item.ctaText[activeLang] || item.ctaText.ru;
      const iconSvg = window.CARAVAN_ICONS ? window.CARAVAN_ICONS[item.iconKey] : '';

      content.innerHTML = `
        <div class="cr-modal-hero">
          <div class="cr-modal-hero-icon">${iconSvg}</div>
          <div class="cr-modal-hero-text">
            <span class="cr-badge-pill">${badge} // ${item.number}</span>
            <h3>${title}</h3>
            <p>${desc}</p>
            <p style="margin-top: 8px; font-size: 13px; color: #94A3B8;">${details}</p>
          </div>
        </div>

        <div class="cr-modal-adv-grid">
          ${item.advantages.map(a => `
            <div class="cr-adv-item">
              <div class="cr-adv-icon">${(window.CARAVAN_ADV_ICONS && window.CARAVAN_ADV_ICONS[a.icon]) ? window.CARAVAN_ADV_ICONS[a.icon] : ''}</div>
              <div class="cr-adv-text">
                <h4>${a.title[activeLang] || a.title.ru}</h4>
                <p>${a.desc[activeLang] || a.desc.ru}</p>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="cr-specs-grid">
          ${item.fleetSpecs.map(s => `
            <div class="cr-spec-box">
              <span>${s.name[activeLang] || s.name.ru}</span>
              <span class="cr-spec-val">${s.spec}</span>
            </div>
          `).join('')}
        </div>

        <div class="cr-modal-footer">
          <div class="cr-modal-contacts">
            <span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; color: var(--cr-gold);"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><strong>+7 (727) 345-00-00</strong></span>
            <span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; color: var(--cr-gold);"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg><strong>info@caravan-rail.com</strong></span>
            <span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; color: var(--cr-gold);"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg><strong>caravan-rail.com</strong></span>
          </div>
          <div style="font-size: 11px; color: #94A3B8; display: flex; align-items: center; gap: 6px;">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: #10B981;"></span>
            <span>Caravan Railroad 24/7</span>
          </div>
        </div>
      `;

      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('cr-service-modal');
      if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    }

    function bindEvents() {
      document.querySelectorAll('.cr-lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cr-lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeLang = btn.getAttribute('data-lang');
          renderTiles();
        });
      });

      const closeBtn = document.getElementById('cr-close-modal-btn');
      if (closeBtn) closeBtn.addEventListener('click', closeModal);

      const modal = document.getElementById('cr-service-modal');
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeModal();
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
